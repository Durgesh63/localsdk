[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localsdk"
version = "0.1.0"
description = "Typed Python client for a self-hosted, OpenAI-compatible LLM endpoint."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LocalSDK" }]
keywords = ["llm", "openai-compatible", "ollama", "sdk", "client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "anyio>=4",
]
# Python 3.10 has no tomllib; install this extra to read ~/.localsdk/config.toml there.
toml = ["tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/Durgesh63/localsdk"
Source = "https://github.com/Durgesh63/localsdk"

[tool.hatch.build.targets.wheel]
packages = ["src/localsdk"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:localsdk.*"]
